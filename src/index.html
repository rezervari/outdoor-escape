<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Outdoor Escape — schelet tehnic (fundație). Nu conține încă jocul.">
  <meta name="theme-color" content="#1f3a2e">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Outdoor Escape (fundație)</title>
  <!-- Toate căile sunt relative (D-035). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="container">
    <p class="badge">Fundație tehnică / skeleton</p>
    <h1>Outdoor Escape</h1>
    <p>
      Acesta este doar scheletul tehnic al aplicației.
      Jocul nu este implementat încă.
    </p>

    <section aria-labelledby="status-title" class="status">
      <h2 id="status-title">Stare tehnică</h2>
      <dl>
        <dt>JavaScript</dt>
        <dd id="status-js">neîncărcat</dd>
        <dt>Service worker</dt>
        <dd id="status-sw">necunoscut</dd>
      </dl>
    </section>

    <noscript>
      <p class="warning">JavaScript este dezactivat. Aplicația are nevoie de JavaScript.</p>
    </noscript>

    <p><a class="button" href="./">Reîncarcă</a></p>
  </main>
</body>
</html>
