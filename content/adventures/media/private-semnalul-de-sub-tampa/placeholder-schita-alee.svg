<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <title>PLACEHOLDER — schița aleii (ASSET TO CREATE)</title>
  <rect width="800" height="600" fill="#f4efe1"/>
  <rect x="12" y="12" width="776" height="576" fill="none" stroke="#3f4a44" stroke-width="4" stroke-dasharray="18 12"/>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#b3261e">PLACEHOLDER</text>
  <text x="400" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3f4a44">Schița aleii: ASSET TO CREATE</text>
  <text x="400" y="344" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3f4a44">omuleț pe alee, muntele în stânga lui</text>
  <text x="400" y="378" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3f4a44">fără puncte cardinale</text>
</svg>
